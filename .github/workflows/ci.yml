name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --package-path MagnifiCalKit
      - name: Test
        run: swift test --package-path MagnifiCalKit
      - name: Format check
        run: |
          brew install swiftformat
          swiftformat --lint MagnifiCalKit/Sources MagnifiCalKit/Tests --config .swiftformat || true
