name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode on the runner
        # GlassCompat compiles on any toolchain (compiler-gated), but the newest SDK
        # exercises the real Liquid Glass branch when the runner image carries Xcode 26.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer" 
      - name: Build
        run: swift build --package-path MagnifiCalKit
      - name: Test
        run: swift test --package-path MagnifiCalKit
      - name: Format check
        run: |
          brew install swiftformat
          swiftformat --lint MagnifiCalKit/Sources MagnifiCalKit/Tests --config .swiftformat || true
