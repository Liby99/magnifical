name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: swift build --package-path CalendarKit
      - name: Test
        run: swift test --package-path CalendarKit
      - name: Format check
        run: |
          brew install swiftformat
          swiftformat --lint CalendarKit/Sources CalendarKit/Tests --config .swiftformat || true
